name: pipeline

on:
  schedule:
    - cron: "0 8 * * *"   # daily 08:00 UTC — HN thread is monthly, reviews move slowly
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write          # to commit the updated database back

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  REVIEW_APPS: "notion,quickbooks"   # edit: comma-separated apps to track reviews for
  BUDGET_USD: "4"                    # per-run extraction spend cap

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline (ingest -> extract -> score)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m painfinder.cli run --apps "$REVIEW_APPS" --budget-usd "$BUDGET_USD" --batch

      - name: Commit updated database
        # always() — extraction spend must be preserved even if a later
        # stage failed, otherwise a crash wastes the API budget already spent
        if: always()
        run: |
          git config user.name "pain-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/painfinder.db
          if git diff --cached --quiet; then
            echo "No new data this run."
          else
            git commit -m "Pipeline run: update database [skip ci]"
            git pull --rebase
            git push
          fi
